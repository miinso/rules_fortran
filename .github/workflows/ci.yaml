name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/docs.yaml'
  pull_request:
    branches: [master]
    paths-ignore:
      - '.github/workflows/docs.yaml'

# a new push to a pr cancels its older run; master runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
        bazel: ['7.x', '8.x', '9.x']
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: macos-15-intel
            name: macOS x86_64
          - os: macos-latest
            name: macOS ARM64
          - os: windows-latest
            name: Windows x86_64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }} (Bazel ${{ matrix.bazel }})
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      MSYS_NO_PATHCONV: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          # action outputs, one cache per leg
          disk-cache: ${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
          bazelisk-version: 1.x
          # prs restore from master but dont save (10 GB repo cache limit)
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Resolve repository cache
        run: echo "REPOSITORY_CACHE=$(bazel info repository_cache)" >> "$GITHUB_ENV"
      - name: Run unit and integration tests
        run: bazel test //test/... //test/integration:basic_test --sandbox_writable_path="$REPOSITORY_CACHE" --verbose_failures --test_output=all
      - name: Run bcr smoke module
        run: cd e2e/smoke && bazel test //... --verbose_failures --test_output=all
      - name: Run examples
        # TODO: switch to //... since we don't want to miss any
        run: cd examples && bazel test //basic:all //blas:all //interop:all //omp:all --verbose_failures --test_output=all
      - name: Run wasm32 tests
        run: cd examples && bazel test --config=wasm //wasm:hello_wasm_test //wasm:full_wasm_test //wasm:omp_hello_wasm_test --verbose_failures --test_output=all

  docs:
    runs-on: ubuntu-latest
    env:
      USE_BAZEL_VERSION: 8.x
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
          bazelisk-version: 1.x
      - name: Generate API docs
        run: |
          bazel build //docs:rules_doc
          cp bazel-bin/docs/rules.md docs/reference/api.md
      - name: Build docs
        run: cd docs && npm install && npm run docs:build
